<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivasi Kartu - QR Review Card</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client Library via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-blue: #0052ff;
            --primary-blue-hover: #0043d0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --focus-ring: rgba(0, 82, 255, 0.15);
            --error-color: #ef4444;
            --success-color: #10b981;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 36px 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        /* Top accent bar like modern banking apps */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0052ff, #3b82f6);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon-badge {
            width: 48px;
            height: 48px;
            background-color: #eff6ff;
            color: var(--primary-blue);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .input-text {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-text:focus {
            background-color: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        /* PIN Input Boxes Styling */
        .pin-container {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        .pin-box {
            width: 23%;
            height: 56px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            background-color: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.2s ease;
        }

        .pin-box:focus {
            background-color: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-blue);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 82, 255, 0.2);
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-blue-hover);
            box-shadow: 0 6px 16px rgba(0, 82, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: #ffffff;
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: var(--shadow-md);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .success-icon {
            width: 60px;
            height: 60px;
            background-color: #d1fae5;
            color: var(--success-color);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .modal-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn-close {
            width: 100%;
            padding: 12px;
            background-color: #f1f5f9;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-close:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="icon-badge">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                    </svg>
                </div>
                <h1 class="title">Aktivasi Kartu</h1>
                <p class="subtitle">Masukkan data bisnis Anda untuk mengaktifkan kartu review.</p>
            </div>

            <form id="activationForm" onsubmit="handleActivation(event)">
                <div class="form-group">
                    <label class="label" for="businessName">Nama Bisnis</label>
                    <input 
                        type="text" 
                        id="businessName" 
                        class="input-text" 
                        placeholder="Contoh: Kopi Kenangan Jaya" 
                        required 
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label class="label">PIN 4 Digit</label>
                    <div class="pin-container">
                        <input type="password" maxlength="1" class="pin-box" pattern="[0-9]*" inputmode="numeric" required>
                        <input type="password" maxlength="1" class="pin-box" pattern="[0-9]*" inputmode="numeric" required>
                        <input type="password" maxlength="1" class="pin-box" pattern="[0-9]*" inputmode="numeric" required>
                        <input type="password" maxlength="1" class="pin-box" pattern="[0-9]*" inputmode="numeric" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <span id="btnText">Aktifkan Kartu</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div class="footer-note">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Sistem enkripsi aman & terproteksi</span>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal">
            <div class="success-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h2 class="modal-title">Kartu Berhasil Diaktifkan!</h2>
            <p class="modal-text">Data bisnis dan kartu review Anda telah berhasil terdaftar dan aktif.</p>
            <button class="btn-close" onclick="closeModal()">Selesai</button>
        </div>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = "https://nvvqyoyygqigngzmvttl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_oofBTUDAJZKI48GkmdJDIA_7S2X8bbx";

        const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

        // Handle Auto Focus & Navigation for PIN Input Boxes
        const pinInputs = document.querySelectorAll('.pin-box');

        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                input.value = input.value.replace(/[^0-9]/g, '');

                if (input.value.length === 1) {
                    if (index < pinInputs.length - 1) {
                        pinInputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 4);
                
                pastedData.split('').forEach((char, i) => {
                    if (pinInputs[i]) {
                        pinInputs[i].value = char;
                    }
                });

                const focusIndex = Math.min(pastedData.length, pinInputs.length - 1);
                pinInputs[focusIndex].focus();
            });
        });

        // Form Submission Logic
        async function handleActivation(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const businessName = document.getElementById('businessName').value;
            
            // 1. Ambil & Gabungkan 4 digit PIN
            let pin = '';
            pinInputs.forEach(input => pin += input.value);

            if (pin.length !== 4) {
                alert('Silakan masukkan 4 digit PIN lengkap.');
                return;
            }

            // Indikator loading pada tombol
            submitBtn.disabled = true;
            btnText.innerText = 'Memproses...';

            try {
                // 2. Simpan ke tabel 'activations' di Supabase
                const { data, error } = await db
                    .from('activations')
                    .insert([
                        {
                            business_name: businessName,
                            pin: pin,
                            created_at: new Date().toISOString()
                        }
                    ]);

                if (error) {
                    // Jika gagal, lemparkan error untuk ditangkap di catch
                    throw error;
                }

                // Jika berhasil: tampilkan modal sukses
                document.getElementById('successModal').classList.add('active');

            } catch (error) {
                // Jika gagal: tampilkan alert(error.message)
                alert(error.message || 'Terjadi kesalahan saat mengaktifkan kartu.');
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = 'Aktifkan Kartu';
            }
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            document.getElementById('activationForm').reset();
            pinInputs[0].focus();
        }
    </script>
</body>
</html>
